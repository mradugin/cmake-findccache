
name: CMake with ccache on multiple platforms and compilers

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.sys.os }}

    strategy:
      fail-fast: false

      matrix:
        # expected_hits: number of compiler calls expected to be cached, i.e. number of
        # source files in the example project compiled through ccache
        sys:
          # Compilation failes with the following error: ccache: error: Could not find compiler "D:\a\_temp\msys64\clang64\bin\clang++.exe" in PATH
          # - { os: windows-latest, shell: 'msys2 {0}', generator: Ninja          }
          - { os: windows-latest, shell: 'msys2 {0}', generator: Unix Makefiles, expected_hits: 2 }

          - { os: ubuntu-latest,  shell: bash,        generator: Ninja,          expected_hits: 2 }
          - { os: ubuntu-latest,  shell: bash,        generator: Unix Makefiles, expected_hits: 2 }

          - { os: macos-latest,   shell: bash,        generator: Ninja,          expected_hits: 2 }
          - { os: macos-latest,   shell: bash,        generator: Unix Makefiles, expected_hits: 2 }

        compiler:
          - { c: gcc,   cpp: g++,     msys: mingw64 }
          - { c: clang, cpp: clang++, msys: clang64 }
        build_type: [Debug]

        include:
          - sys: { os: windows-2022,   shell: bash, generator: Visual Studio 17 2022, expected_hits: 2 }
            compiler: { c: cl,    cpp: cl      }
            build_type: Debug
          - sys: { os: windows-latest, shell: bash, generator: Visual Studio 18 2026, expected_hits: 2 }
            compiler: { c: cl,    cpp: cl      }
            build_type: Debug
          - sys: { os: macos-latest,   shell: bash, generator: Xcode,                 expected_hits: 2 }
            compiler: { c: clang, cpp: clang++ }
            build_type: Debug

    defaults:
      run:
        shell: ${{ matrix.sys.shell }}

    steps:
    - uses: actions/checkout@v5

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        restore: false
        save: false
        verbose: 2
        variant: ccache
  
    # MSBuild file tracking deletes files written by the compiler (ccache) on Clean,
    # unless the cache is within %LOCALAPPDATA%, %APPDATA% or %TEMP%
    - name: Use untracked ccache directory (Visual Studio)
      if: ${{ startsWith(matrix.sys.generator, 'Visual Studio') }}
      run: |
        echo "CCACHE_DIR=$LOCALAPPDATA\\ccache" >> "$GITHUB_ENV"

    - name: Install ninja (ubuntu)
      if: ${{ matrix.sys.os == 'ubuntu-latest' && matrix.sys.generator == 'Ninja' }}
      run: |
        sudo apt update
        sudo apt -y install ninja-build

    - name: Install ninja (macos)
      if: ${{ matrix.sys.os == 'macos-latest' && matrix.sys.generator == 'Ninja' }}
      run: |
        brew install ninja

    - name: Install MSYS2 (windows)
      if: ${{ matrix.sys.shell == 'msys2 {0}' }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.compiler.msys }}
        update: true
        install: >-
          make
          ccache
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p

    - name: Environment versions
      run: |
        echo "cmake:  $(command -v cmake)"
        cmake --version | head -n 1
        echo "ccache: $(command -v ccache)"
        ccache --version | head -n 1

    - name: Set reusable strings
      id: strings
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "source-dir=${{ github.workspace }}/example" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: |
        cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cpp }} -DCMAKE_C_COMPILER=${{ matrix.compiler.c }} -S "${{ steps.strings.outputs.source-dir }}" -B "${{ steps.strings.outputs.build-output-dir }}" -G "${{matrix.sys.generator}}"

    - name: Build (empty cache)
      run: |
        ccache --zero-stats
        cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} --verbose
        ccache --show-stats
        .github/scripts/check-ccache-stats.sh 0 ${{ matrix.sys.expected_hits }}

    - name: Build (cached)
      run: |
        ccache --zero-stats
        cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} --target clean --verbose
        cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} --verbose
        ccache --show-stats
        .github/scripts/check-ccache-stats.sh ${{ matrix.sys.expected_hits }} 0
